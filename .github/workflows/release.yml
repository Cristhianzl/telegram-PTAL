name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

# Two tag pushes in quick succession would otherwise race: the first run
# uploads the assets and the second fails with "already_exists".
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # goreleaser builds the changelog from the commit history, which
          # needs the full history rather than a shallow clone.
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: "1.24"
          cache: true

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
