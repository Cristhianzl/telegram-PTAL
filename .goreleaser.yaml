version: 2

project_name: ptal

before:
  hooks:
    - go mod tidy

builds:
  - id: ptal
    main: ./cmd/ptal
    binary: ptal
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: ptal
    # A plain binary in a flat archive: the install script and the package
    # managers all expect to find `ptal` at the archive root.
    files:
      - README.md
      - LICENSE
      - .env.example
    format_overrides:
      - goos: windows
        formats: [zip]

checksums:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
  groups:
    - title: Features
      regexp: '^feat'
      order: 0
    - title: Fixes
      regexp: '^fix'
      order: 1
    - title: Other
      order: 99
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - '^ci:'

release:
  footer: |
    ## Install

    **macOS and Linux**
    ```bash
    curl -fsSL https://raw.githubusercontent.com/Cristhianzl/telegram-PTAL/main/install.sh | sh
    ```

    **Windows** — download `ptal_Windows_x86_64.zip` below and extract it.

    Then run `ptal setup`, followed by `ptal install`.
